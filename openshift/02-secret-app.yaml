# Fill in the real values before applying — never commit filled-in secrets to Git.
# Apply with:  oc apply -f openshift/02-secret-app.yaml
# or generate it without ever writing secrets to disk, see DEPLOYMENT.md step 4.
apiVersion: v1
kind: Secret
metadata:
  name: robodoc2-db
  labels:
    app: robodoc2
type: Opaque
stringData:
  DB_HOST: "CHANGE-ME"          # e.g. robodoc2-mysql (in-cluster) or your Azure Database for MySQL host
  DB_PORT: "3306"
  DB_NAME: "robodoc2"
  DB_USER: "robodoc2"
  DB_PASS: "CHANGE-ME"
  MYSQL_ROOT_PASSWORD: "CHANGE-ME"   # only used by the optional in-cluster MySQL (03b)
---
apiVersion: v1
kind: Secret
metadata:
  name: robodoc2-app
  labels:
    app: robodoc2
type: Opaque
stringData:
  APP_KEY: "CHANGE-ME-generate-with-openssl-rand-hex-32"
  APP_SECRET: "CHANGE-ME-generate-with-openssl-rand-hex-32"
