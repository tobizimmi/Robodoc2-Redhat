apiVersion: apps/v1
kind: Deployment
metadata:
  name: robodoc2
  labels:
    app: robodoc2
spec:
  replicas: 1
  # ReadWriteOnce uploads volume — only one pod can mount it at a time, so the
  # default RollingUpdate strategy deadlocks (new pod can't attach while the
  # old one still holds it, "Multi-Attach error"). Recreate stops the old pod
  # first, then starts the new one — brief downtime per deploy, but no
  # deadlock. Same reasoning as robodoc2-mysql in 03-mysql-optional.yaml.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: robodoc2
  template:
    metadata:
      labels:
        app: robodoc2
    spec:
      containers:
        - name: robodoc2
          image: image-registry.openshift-image-registry.svc:5000/YOUR-PROJECT/robodoc2:latest
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              valueFrom: { secretKeyRef: { name: robodoc2-db, key: DB_HOST } }
            - name: DB_PORT
              valueFrom: { secretKeyRef: { name: robodoc2-db, key: DB_PORT } }
            - name: DB_NAME
              valueFrom: { secretKeyRef: { name: robodoc2-db, key: DB_NAME } }
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: robodoc2-db, key: DB_USER } }
            - name: DB_PASS
              valueFrom: { secretKeyRef: { name: robodoc2-db, key: DB_PASS } }
            - name: APP_KEY
              valueFrom: { secretKeyRef: { name: robodoc2-app, key: APP_KEY } }
            - name: APP_SECRET
              valueFrom: { secretKeyRef: { name: robodoc2-app, key: APP_SECRET } }
          volumeMounts:
            - name: uploads
              mountPath: /var/www/html/uploads
          readinessProbe:
            httpGet: { path: /login, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /login, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: "1",  memory: 768Mi }
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: robodoc2-uploads
---
apiVersion: v1
kind: Service
metadata:
  name: robodoc2
  labels:
    app: robodoc2
spec:
  selector:
    app: robodoc2
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: robodoc2
  labels:
    app: robodoc2
spec:
  to:
    kind: Service
    name: robodoc2
  port:
    targetPort: 8080
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
